[package]
name = "kolibri"
version = "0.1.0"
edition = "2021"
description = "A fast, minimal HTTP API client"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11", "wayland"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
dirs = "6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
